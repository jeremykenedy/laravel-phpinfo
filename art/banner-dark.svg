<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" role="img" aria-labelledby="title description">
    <title id="title">Laravel PHP Info</title>
    <desc id="description">PHP configuration and extensions in a Laravel page, with Bootstrap, Tailwind, and dark mode.</desc>
    <defs><linearGradient id="background" x2="1" y2="1"><stop stop-color="#0c0a09"/><stop offset="1" stop-color="#1c1917"/></linearGradient></defs>
    <rect width="800" height="200" rx="16" fill="url(#background)" stroke="#44403c"/>
    <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
        <text x="40" y="80" fill="#fff" font-size="40" font-weight="700" letter-spacing="-.5">Laravel PHP Info</text>
        <text x="40" y="111" fill="#a8a29e" font-size="14">Your PHP environment, at a glance.</text>
        <rect x="40" y="132" width="79" height="22" rx="11" fill="#1a1a1a" stroke="#a78bfa" stroke-width=".8" opacity=".8"/><text x="79.5" y="147" fill="#a78bfa" font-size="10" font-weight="500" text-anchor="middle">Blade views</text><rect x="127" y="132" width="90" height="22" rx="11" fill="#1a1a1a" stroke="#60a5fa" stroke-width=".8" opacity=".8"/><text x="172.0" y="147" fill="#60a5fa" font-size="10" font-weight="500" text-anchor="middle">Bootstrap 3-5</text><rect x="225" y="132" width="74" height="22" rx="11" fill="#1a1a1a" stroke="#4ade80" stroke-width=".8" opacity=".8"/><text x="262.0" y="147" fill="#4ade80" font-size="10" font-weight="500" text-anchor="middle">Tailwind CSS</text><rect x="307" y="132" width="78" height="22" rx="11" fill="#1a1a1a" stroke="#fbbf24" stroke-width=".8" opacity=".8"/><text x="346.0" y="147" fill="#fbbf24" font-size="10" font-weight="500" text-anchor="middle">Dark mode</text>
        <g transform="translate(566, 34)">
            <rect width="190" height="132" rx="12" fill="#1c1917" stroke="#44403c"/>
            <path d="M0 31 H190" stroke="#44403c"/>
            <circle cx="16" cy="16" r="3" fill="#a78bfa"/>
            <circle cx="27" cy="16" r="3" fill="#60a5fa"/>
            <circle cx="38" cy="16" r="3" fill="#4ade80"/>
            <text x="153" y="21" font-size="11" text-anchor="middle" font-weight="700" fill="#a8a29e">PHP</text>
            <rect x="15" y="45" width="62" height="7" rx="3.5" fill="#8b5cf6"/>
            <rect x="96" y="45" width="77" height="7" rx="3.5" fill="#57534e"/>
            <rect x="15" y="65" width="48" height="7" rx="3.5" fill="#3b82f6"/>
            <rect x="96" y="65" width="61" height="7" rx="3.5" fill="#57534e"/>
            <rect x="15" y="85" width="57" height="7" rx="3.5" fill="#8b5cf6"/>
            <rect x="96" y="85" width="70" height="7" rx="3.5" fill="#57534e"/>
            <circle cx="19" cy="112" r="3" fill="#22c55e"/>
            <text x="29" y="115" fill="#a8a29e" font-size="9">Runtime information</text>
        </g>
    </g>
</svg>
